name: Build Drh Mandiri APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'download/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -o app.zip

      - name: Fix Android package
        run: sed -i 's/id\.drhmandiri\.apq/id.drhmandiri.app/g' app/src/main/AndroidManifest.xml

      - name: Enable AndroidX
        run: |
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" > gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare download files
        run: |
          mkdir -p download
          cp app/build/outputs/apk/debug/app-debug.apk download/Drh-Mandiri.apk
          cd download
          zip -j Drh-Mandiri-APK.zip Drh-Mandiri.apk

      - name: Save APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download/Drh-Mandiri.apk download/Drh-Mandiri-APK.zip
          git diff --cached --quiet || git commit -m "Update APK download"
          git push

      - name: Upload APK artifact backup
        uses: actions/upload-artifact@v4
        with:
          name: Drh-Mandiri-APK
          path: download/

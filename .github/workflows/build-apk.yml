name: Build Drh Mandiri APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -o Drh-Mandiri-Android-Source*.zip
          ls -la
          ls -la DrhMandiri

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: DrhMandiri
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp DrhMandiri/app/build/outputs/apk/debug/app-debug.apk Drh-Mandiri.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Drh-Mandiri-APK
          path: Drh-Mandiri.apk
